[project]
name = "kinect-eye-tracker"
version = "0.1.0"
description = "Kinect v2 head pose and screen-gaze tracker (MediaPipe FaceLandmarker) streaming to LSL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pylsl>=1.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["tracker.py", "shm_client.py", "calibration.py", "filters.py", "gaze_model.py", "validation.py", "session_recorder.py"]
